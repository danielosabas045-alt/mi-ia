name: OSAIA AI — prueba puntual de chat con servidor real

on:
  push:
    paths:
      - '.github/workflows/chat-smoke-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probar una sola respuesta real del backend HTTPS
        shell: bash
        run: |
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 45 --output /tmp/osaia-chat-response.json --write-out '%{http_code}' \
            --request POST 'https://osaia-ai-web.onrender.com/api/chat' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://danielosabas045-alt.github.io' \
            --data '{"messages":[{"role":"user","content":"Contestá con un saludo breve en español."}]}' || true)
          echo "${status:-000}" > /tmp/osaia-chat-code.txt
          node <<'NODE'
          const fs = require('fs');
          const status = fs.readFileSync('/tmp/osaia-chat-code.txt', 'utf8').trim();
          let data = {};
          try { data = JSON.parse(fs.readFileSync('/tmp/osaia-chat-response.json', 'utf8')); }
          catch (_) { data = {}; }
          const ok = status === '200' && typeof data.reply === 'string' && data.reply.trim().length > 0;
          const diagnostic = typeof data.error === 'string' ? data.error.trim().slice(0, 280) : 'El servidor no entregó una respuesta de IA válida.';
          const lines = [
            '# OSAIA AI — prueba puntual del chat real',
            '',
            'Resultado: ' + (ok ? 'PASS' : 'FAIL'),
            '',
            'POST /api/chat: HTTP ' + status,
            '',
            ok ? 'El servidor devolvió texto generado. No se almacenó el mensaje.' : 'Motivo seguro: ' + diagnostic,
            '',
            'No se publicaron claves API, conversación ni datos privados.'
          ];
          fs.writeFileSync('CHAT_VERIFY.md', lines.join('\n') + '\n');
          console.log('Comprobación de chat:', ok ? 'PASS' : 'FAIL', 'HTTP', status);
          if (!ok) console.log('Motivo:', diagnostic);
          NODE
      - name: Guardar el resultado seguro
        if: always()
        shell: bash
        run: |
          if [[ -f CHAT_VERIFY.md ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHAT_VERIFY.md
            git commit -m 'ci: record one-time real OSAIA API verification' || true
            git push || true
          fi
