name: OSAIA AI — probar y publicar web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: osaia-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Comprobar JavaScript
        run: |
          node --check app.js
          node --check server/server.cjs
      - name: Ejecutar pruebas
        run: node --test tests/*.test.cjs
      - name: Preparar archivos públicos
        run: |
          mkdir -p public
          cp index.html app.js styles.css sw.js manifest.webmanifest public/
          mkdir -p public/icons
          cp icons/icon.svg public/icons/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar OSAIA AI
        id: deployment
        uses: actions/deploy-pages@v4
